<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מה עושים עכשיו? - קוביית ההחלטות</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .filters {
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .filter-btn {
            padding: 8px 14px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }
        .filter-btn.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }
        .dice-section {
            margin: 30px 0;
            cursor: pointer;
        }
        .dice {
            font-size: 60px;
            display: inline-block;
            transition: transform 0.5s;
        }
        .dice.rolling {
            transform: rotate(360deg) scale(1.2);
        }
        .roll-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .result-card {
            margin-top: 30px;
            padding: 20px;
            background: #e9ecef;
            border-radius: 8px;
            display: none;
            text-align: right;
        }
        .activity-title {
            color: #007bff;
            font-size: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎲 מה עושים עכשיו?</h1>
    
    <!-- אזור הסינונים -->
    <div class="filters">
        <button class="filter-btn active" data-category="all">הכל מהכל ✨</button>
        <button class="filter-btn" data-category="home">בבית 🏠</button>
        <button class="filter-btn" data-category="out">בחוץ 🌳</button>
        <button class="filter-btn" data-category="energy">תנועה ומרץ ⚡</button>
        <button class="filter-btn" data-category="quiet">שקט ורגע משחקי 🧩</button>
        <button class="filter-btn" data-category="art">יצירה ודמיון 🎨</button>
    </div>

    <!-- אזור הקובייה -->
    <div class="dice-section" onclick="rollDice()">
        <div class="dice" id="diceElement">🎲</div>
    </div>
    <button class="roll-btn" onclick="rollDice()">הטל את הקובייה! 🎲</button>

    <!-- תוצאה -->
    <div class="result-card" id="resultCard">
        <div id="resContainer"></div>
    </div>
</div>

<script>
    const activities = [
        // בבית
        { title: "בניית מגדל קוביות ענק", desc: "לנסות לבנות מגדל גבוה ככל האפשר לפני שהוא נופל", materials: "קוביות משחק", time: "15 דקות", category: "home" },
        { title: "משחק מחבואים בבית", desc: "למצא מקומות מחבוא יצירתיים בתוך הבית", materials: "ללא צורך בציוד", time: "15 דקות", category: "home" },
        { title: "הכנת אוהל סדינים בסלון", desc: "למתוח סדינים בין הכסאות והספה וליצור מחנה פרטי", materials: "סדינים וכסאות", time: "25 דקות", category: "home" },
        { title: "תיאטרון בובות גרביים", desc: "לקחת גרביים ישנים, לצייר עליהם עיניים ולהציג הצגה", materials: "גרביים וטושים", time: "20 דקות", category: "home" },
        { title: "מחנה קמפינג בסלון", desc: "לפרוס מזרונים ושמיכות על הרצפה כאילו ישנים בשטח", materials: "מזרונים ושמיכות", time: "30 דקות", category: "home" },

        // יצירה ודמיון
        { title: "ציור גואש חופשי", desc: "להוציא צבעים ולצייר על דף גדול בלי הגבלה", materials: "צבעי גואש ודפים", time: "30 דקות", category: "art" },
        { title: "יצירה בלגו או פלסטלינה", desc: "להמציא דמויות או מבנים מיוחדים מחומרים שיש בבית", materials: "לגו או פלסטלינה", time: "20 דקות", category: "art" },
        { title: "גיזור הדבקה ויצירת ספר קומיקס", desc: "לקפל דפים ולספר סיפור עם ציורים וגזירים", materials: "דפים, מספריים ודבק", time: "30 דקות", category: "art" },
        { title: "הכנת כתרים נוצצים", desc: "לגזור בריסטול בצורת כתר ולקשט במדבקות ונצנצים", materials: "בריסטול ומדבקות", time: "20 דקות", category: "art" },

        // תנועה ומרץ
        { title: "מסלול מכשולים בסלון", desc: "לארגן כריות ושרפרפים ולעבור אותם בלי לגעת ברצפה", materials: "כריות ושמיכות", time: "20 דקות", category: "energy" },
        { title: "ריקוד השירים האהובים", desc: "לשים מוזיקה קצבית ולקפוץ ולרקוד בכל הכוח", materials: "רמקול או טלפון שמע", time: "15 דקות", category: "energy" },
        { title: "משחק תפוס אותי / מרוץ שליחים", desc: "לרוץ מנקודה לנקודה בבית לפי מסלול מוגדר", materials: "ללא צורך בציוד", time: "15 דקות", category: "energy" },
        { title: "תחרויות קפיצות כמו צפרדעים", desc: "לראות מי קופץ הכי רחוק מקצה הסלון לשטיח", materials: "ללא צורך בציוד", time: "10 דקות", category: "energy" },

        // בחוץ
        { title: "טיול קצר שכונתי", desc: "לצאת לסיבוב קצר לחפש חתולים או פרחים מעניינים", materials: "עגלות או נעלי הליכה", time: "25 דקות", category: "out" },
        { title: "בועות סבון בחצר", desc: "לנפח בועות סבון גדולות ולנסות לתפוס אותן", materials: "ערכת בועות סבון", time: "20 דקות", category: "out" },
        { title: "איסוף אבנים וענפים מיוחדים", desc: "לצאת לחצר או לגינה הציבורית ולאסוף פריטי טבע מעניינים", materials: "שקיות קטנות לאיסוף", time: "20 דקות", category: "out" },
        { title: "ציור בגיר על המדרכה", desc: "לקשט את הרחבה בציורים צבעוניים ושמחים", materials: "גירים צבעוניים", time: "25 דקות", category: "out" },

        // שקט ורגע משחקי
        { title: "משחק התאמת צורות שקט", desc: "לשבת בשקט על השטיח ולסדר משחקי התאמה", materials: "משחק הרכבה", time: "15 דקות", category: "quiet" },
        { title: "דפדוף והקראת סיפורים משותפת", desc: "להתכרבל ולעיין בספרי הילדים האהובים", materials: "ספרים מהמדף", time: "20 דקות", category: "quiet" },
        { title: "הרכבת פאזל רצפה", desc: "לשבת יחד ולהרכיב פאזל גדול על השטיח", materials: "פאזל", time: "25 דקות", category: "quiet" },
        { title: "משחק דומינו או קלפים מותאמים", desc: "להניח קלפים או חלקי דומינו בסבלנות בשורה", materials: "משחק קופסה שקט", time: "15 דקות", category: "quiet" }
    ];

    let currentCategory = 'all';

    const filterBtns = document.querySelectorAll('.filter-btn');
    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = btn.getAttribute('data-category');
        });
    });

    function rollDice() {
        const dice = document.getElementById('diceElement');
        const resultCard = document.getElementById('resultCard');

        const filtered = currentCategory === 'all'
            ? [...activities]
            : activities.filter(act => act.category === currentCategory);

        if (filtered.length === 0) {
            alert('אין עדיין פעילויות בקטגוריה הזו, נסי לבחור "הכל מהכל"');
            return;
        }

        dice.classList.add('rolling');
        resultCard.style.display = 'none';

        setTimeout(() => {
            dice.classList.remove('rolling');

            // ערבוב אמיתי וחזק (Fisher-Yates) שמוודא שנקבל בכל פעם תוצאות שונות לגמרי
            for (let i = filtered.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
            }

            const howMany = Math.min(3, filtered.length);
            const selectedItems = filtered.slice(0, howMany);

            let htmlContent = `<h3 style='margin-top:0; color:#333;'>✨ הנה ${howMany} אפשרויות חדשות בשבילך:</h3>`;
            selectedItems.forEach((item, index) => {
                htmlContent += `
                    <div style="margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #ddd;">
                        <div class="activity-title">${index + 1}. ${item.title}</div>
                        <p style="margin: 4px 0; color: #555;">${item.desc}</p>
                        <p style="margin: 4px 0; font-size: 13px; color: #666;"><strong>מה צריך? 🎒:</strong> ${item.materials} | <strong>זמן ⏱️:</strong> ${item.time}</p>
                    </div>
                `;
            });

            document.getElementById('resContainer').innerHTML = htmlContent;
            resultCard.style.display = 'block';
            resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 500);
    }
</script>

</body>
</html>
