<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מה עושים עכשיו?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎲 מה עושים עכשיו?</h1>
    <button onclick="rollDice()">הטל את הקובייה!</button>
    <div class="result" id="resultBox">לחצי על הכפתור כדי לקבל 3 פעילויות</div>
</div>

<script>
    const activities = [
        "בניית מגדל קוביות ענק 🏗️",
        "ציור גואש חופשי 🎨",
        "מסלול מכשולים בסלון 🏃‍♀️",
        "טיול קצר שכונתי 🌳",
        "משחק הרכבה שקט 🧩",
        "סיפור משותף בספרייה 📚",
        "ריקוד השירים האהובים 🎶"
    ];

    function rollDice() {
        // ערבוב ובחירת 3 פעילויות שונות
        const shuffled = [...activities].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, 3);

        // הצגה על המסך
        document.getElementById('resultBox').innerHTML = 
            "הנה 3 אפשרויות בשבילך:<br><br>" + selected.join('<br>✨ ');
    }
</script>

</body>
</html>
