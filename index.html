<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מה עושים עכשיו? - קוביית הפעילויות לגיל הרך</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2D3748;
            --light: #F7FAFC;
            --pink: #FF8FAB;
            --purple: #9D4EDD;
            --blue: #3A86EF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rubik', sans-serif;
        }

        body {
            background-color: #F0F4F8;
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: white;
            padding: 1rem 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Varela Round', sans-serif;
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .hero-title {
            text-align: center;
            font-size: 2.2rem;
            color: var(--dark);
            font-family: 'Varela Round', sans-serif;
        }

        .hero-subtitle {
            text-align: center;
            color: #718096;
            font-size: 1.1rem;
            margin-top: -1.2rem;
        }

        /* סרגל מסננים */
        .filters-container {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .filter-btn {
            background: white;
            border: 2px solid #E2E8F0;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .filter-btn:hover {
            border-color: var(--secondary);
        }

        .filter-btn.active {
            background: var(--secondary);
            color: white;
            border-color: var(--secondary);
            box-shadow: 0 4px 10px rgba(78, 205, 196, 0.3);
        }

        /* אזור הקובייה */
        .dice-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
        }

        .dice-container {
            perspective: 1000px;
            width: 160px;
            height: 160px;
            cursor: pointer;
        }

        .dice {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .dice.rolling {
            transform: rotateX(720deg) rotateY(720deg) rotateZ(360deg);
        }

        .dice-face {
            position: absolute;
            width: 100%;
            height: 100%;
            background: white;
            border: 4px solid var(--primary);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05), 0 10px 25px rgba(0,0,0,0.1);
        }

        .roll-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 3rem;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
            transition: transform 0.1s, background 0.2s;
            font-family: 'Varela Round', sans-serif;
        }

        .roll-btn:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        .roll-btn:active {
            transform: translateY(1px);
        }

        /* כרטיסיית תוצאה */
        .result-card {
            background: white;
            width: 100%;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            display: none;
            animation: slideUp 0.4s ease forwards;
            border-top: 6px solid var(--primary);
            position: relative;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .activity-tag {
            background: #FFF0F0;
            color: var(--primary);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .activity-title {
            font-size: 1.8rem;
            color: var(--dark);
            margin-bottom: 0.5rem;
            font-family: 'Varela Round', sans-serif;
        }

        .activity-desc {
            font-size: 1.1rem;
            color: #4A5568;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .activity-details {
            background: #F8FAFC;
            padding: 1rem;
            border-radius: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            font-size: 0.95rem;
        }

        .detail-item strong {
            display: block;
            color: var(--dark);
            margin-bottom: 0.2rem;
        }

        /* אזור הוספת פעילות */
        .add-section {
            background: white;
            width: 100%;
            border-radius: 20px;
            padding: 1.5rem 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .add-section h3 {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            color: var(--dark);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #E2E8F0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Rubik', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: var(--secondary);
        }

        .submit-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
        }

        .submit-btn:hover {
            background: #3dbdb4;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: #A0AEC0;
            font-size: 0.9rem;
            background: white;
            margin-top: auto;
        }

        @media (max-width: 600px) {
            .activity-details {
                grid-template-columns: 1fr;
            }
            .hero-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🎲 מה עושים עכשיו?</div>
    </header>

    <main>
        <div style="text-align: center;">
            <h1 class="hero-title">משועממים? בואו נגריל פעילות!</h1>
            <p class="hero-subtitle">הכלי המושלם להורים ולגננות לשליפה מהירה של רעיונות כיפיים</p>
        </div>

        <!-- מסננים -->
        <div class="filters-container" id="filters">
            <button class="filter-btn active" data-category="all">הכל מהכל ✨</button>
            <button class="filter-btn" data-category="home">בבית 🏠</button>
            <button class="filter-btn" data-category="out">בחוץ 🌳</button>
            <button class="filter-btn" data-category="energy">תנועה ומרץ ⚡</button>
            <button class="filter-btn" data-category="quiet">שקט ורגוע 🧩</button>
            <button class="filter-btn" data-category="art">יצירה ודמיון 🎨</button>
        </div>

        <!-- אזור הקובייה -->
        <div class="dice-section">
            <div class="dice-container" onclick="rollDice()">
                <div class="dice" id="diceElement">
                    <div class="dice-face">🎲</div>
                </div>
            </div>
            <button class="roll-btn" onclick="rollDice()">הטל את הקובייה! 🚀</button>
        </div>

        <!-- תוצאה -->
        <div class="result-card" id="resultCard">
            <div class="result-header">
                <span class="activity-tag" id="resCategory">קטגוריה</span>
            </div>
            <h2 class="activity-title" id="resTitle">שם הפעילות</h2>
            <p class="activity-desc" id="resDesc">תיאור הפעילות יופיע כאן...</p>
            <div class="activity-details">
                <div class="detail-item">
                    <strong>מה צריך? 🎒</strong>
                    <span id="resMaterials">רשימת ציוד</span>
                </div>
                <div class="detail-item">
                    <strong>משך זמן ⏱️</strong>
                    <span id="resTime">כ-15 דקות</span>
                </div>
            </div>
        </div>

        <!-- הוספת פעילות אישית -->
        <div class="add-section">
            <h3>➕ הוספת רעיון משלך לקובייה</h3>
            <form id="addForm" onsubmit="addNewActivity(event)">
                <div class="form-group">
                    <input type="text" id="newTitle" placeholder="שם הפעילות (למשל: מחנה אוהלים בסלון)" required>
                </div>
                <div class="form-group">
                    <textarea id="newDesc" rows="2" placeholder="איך משחקים? קצת פרטים..." required></textarea>
                </div>
                <div class="form-group" style="display: flex; gap: 10px;">
                    <input type="text" id="newMaterials" placeholder="מה צריך? (למשל: סדינים וכריות)" required>
                    <select id="newCategory">
                        <option value="home">בבית</option>
                        <option value="out">בחוץ</option>
                        <option value="energy">תנועה ומרץ</option>
                        <option value="quiet">שקט ורגוע</option>
                        <option value="art">יצירה ודמיון</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn">שמור רעיון חדש</button>
            </form>
        </div>
    </main>

    <footer>
        נבנה באהבה עבור רגעים שמחים 💛
    </footer>

    <script>
        // מאגר פעילויות התחלתי
        let activities = JSON.parse(localStorage.getItem('my_activities')) || [
            { title: "מחנה אוהלים בסלון", desc: "הופכים את הספה והכריות למחנה סודי עם פנסים וספרים בפנים.", materials: "סדינים, כריות, פנס", category: "home", time: "30-45 דקות" },
            { title: "מסלול מכשולים מניירות", desc: "מניחים דפים על הרצפה שצריך לדלג ביניהם מבלי 'לגעת בלבה'.", materials: "דפי נייר צבעוניים", category: "energy", time: "20 דקות" },
            { title: "ציור באמבטיה עם צבעי גואש", desc: "נותנים לילדים לצייר חופשי על קרמיקה או אמבטיה נקייה – יורד במים בקלות!", materials: "צבעי ידיים המותאמים לאמבטיה", category: "art", time: "25 דקות" },
            { title: "חפש את המטמון צבעוני", desc: "מבקשים מהילד להביא 3 דברים בבית שהם בצבע אדום, ואז ירוק וכו'.", materials: "שום דבר מיוחד", category: "quiet", time: "15 דקות" },
            { title: "טיול שלוליות או אבנים גדולות", desc: "יוצאים החוצה לגינה לחפש חרקים, לאסוף עלים מעניינים או לקפוץ בשלוליות.", materials: "נעליים סגורות", category: "out", time: "שעה" }
        ];

        let currentCategory = 'all';

        // טיפול במסננים
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.getAttribute('data-category');
            });
        });

        function rollDice() {
            const dice = document.getElementById('diceElement');
            const resultCard = document.getElementById('resultCard');
            
            // סינון פעילויות לפי הקטגוריה שנבחרה
            const filtered = currentCategory === 'all' 
                ? activities 
                : activities.filter(act => act.category === currentCategory);

            if (filtered.length === 0) {
                alert('אין עדיין פעילויות בקטגוריה הזו, נסה להוסיף אחת או לבחור "הכל מהכל"!');
                return;
            }

            // אנימציית סיבוב
            dice.classList.add('rolling');
            resultCard.style.display = 'none';

            setTimeout(() => {
                dice.classList.remove('rolling');
                
                // בחירת פעילות אקראית
                const randomItem = filtered[Math.floor(Math.random() * filtered.length)];
                
                // הצגת התוצאה
                document.getElementById('resTitle').innerText = randomItem.title;
                document.getElementById('resDesc').innerText = randomItem.desc;
                document.getElementById('resMaterials').innerText = randomItem.materials;
                document.getElementById('resTime').innerText = randomItem.time || 'כ-15 דקות';
                
                const categoryNames = {
                    'home': 'בבית 🏠',
                    'out': 'בחוץ 🌳',
                    'energy': 'תנועה ומרץ ⚡',
                    'quiet': 'שקט ורגוע 🧩',
                    'art': 'יצירה ודמיון 🎨'
                };
                document.getElementById('resCategory').innerText = categoryNames[randomItem.category] || 'כללי';

                resultCard.style.display = 'block';
                resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 800);
        }

        function addNewActivity(e) {
            e.preventDefault();
            const title = document.getElementById('newTitle').value;
            const desc = document.getElementById('newDesc').value;
            const materials = document.getElementById('newMaterials').value;
            const category = document.getElementById('newCategory').value;

            const newAct = { title, desc, materials, category, time: "20 דקות" };
            activities.push(newAct);
            
            // שמירה בזיכרון המקומי בדפדפן
            localStorage.setItem('my_activities', JSON.stringify(activities));

            alert('הפעילות נוספה בהצלחה לקובייה!');
            document.getElementById('addForm').reset();
        }
    </script>
</body>
</html>
